# Evaluates 01-rag on a made-up handbook. Run: promptfoo eval -c rag.yaml
description: RAG document assistant - which model answers handbook questions best?

prompts:
  - "{{question}}"

providers:
  - id: file://providers.py:call_rag
    label: rag + gemma3:12b
    config: { model: "gemma3:12b", pythonExecutable: ../.venv/Scripts/python.exe }
  - id: file://providers.py:call_rag
    label: rag + qwen3:8b
    config: { model: "qwen3:8b", pythonExecutable: ../.venv/Scripts/python.exe }

defaultTest:
  options:
    provider: ollama:chat:gemma3:12b  # local judge for llm-rubric
  assert:
    - type: javascript  # every answer must cite a source or say it isn't there
      value: /\[\d+\]/.test(output) || output.includes('Not in the documents')

tests:
  - vars: { question: "What are the core hours?" }
    assert:
      - { type: icontains, value: "10:00" }
      - { type: icontains, value: "15:00" }
  - vars: { question: "How many vacation days do employees get?" }
    assert:
      - { type: icontains, value: "30" }
  - vars: { question: "When must summer vacation requests be sent?" }
    assert:
      - { type: icontains, value: "31 March" }
  - vars: { question: "How much is the learning budget per year?" }
    assert:
      - { type: javascript, value: "/12[\\s\\u00a0,.]?000/.test(output)" }
  - vars: { question: "Can I work fully remote?" }
    assert:
      - type: llm-rubric
        value: Says remote work is allowed up to three days a week and that full-time remote needs the team lead's approval.
  - vars: { question: "How is overtime paid?" }
    assert:
      - { type: icontains, value: "150" }
  # Conflict: the old IT FAQ says 4 000 SEK, the handbook 6 000 SEK
  - vars: { question: "How big is the home-office allowance?" }
    assert:
      - { type: javascript, value: "/6[\\s\\u00a0,.]?000/.test(output)" }
      - type: llm-rubric
        value: Gives 6 000 SEK as the current amount, and if it mentions 4 000 SEK it says that figure is from an older or conflicting source.
  # Not answerable: must not make something up
  - vars: { question: "What is the parental leave policy?" }
    assert:
      - { type: icontains, value: "Not in the documents" }
  - vars: { question: "Who is the CEO of Fjordlight Games?" }
    assert:
      - { type: icontains, value: "Not in the documents" }
  - vars: { question: "Hur många semesterdagar har man?" }
    assert:
      - { type: icontains, value: "30" }
      - type: llm-rubric
        value: The answer is written in Swedish.
